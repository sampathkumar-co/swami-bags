name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck and build
        run: npm run build

  server:
    name: Spring Boot server
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Test and package
        run: mvn -B package

  runtime:
    name: Production runtime smoke
    runs-on: ubuntu-latest
    needs: [frontend, server]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare runtime environment
        run: |
          cp .env.example .env
          sed -i 's/^ADMIN_PASSWORD=.*/ADMIN_PASSWORD=ci-test-password-12345/' .env

      - name: Validate operations scripts and Compose
        run: |
          sh -n scripts/preflight.sh
          sh -n scripts/deploy.sh
          sh -n scripts/backup.sh
          sh -n scripts/restore.sh
          sh scripts/preflight.sh

      - name: Build production images
        run: docker compose build

      - name: Start production stack
        run: docker compose up -d

      - name: Wait for public web and admin API
        run: |
          for attempt in {1..40}; do
            if curl -fsS http://127.0.0.1:8088/healthz >/dev/null \
              && curl -fsS http://127.0.0.1:8088/api/admin/auth/csrf >/dev/null \
              && curl -fsS http://127.0.0.1:8088/catalog/products.json >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs --tail=200
          exit 1

      - name: Verify protected admin endpoint
        run: |
          code="$(curl -sS -o /tmp/admin-response.json -w '%{http_code}' http://127.0.0.1:8088/api/admin/dashboard)"
          test "$code" = "401"

      - name: Exercise authenticated product publish flow
        run: |
          set -euo pipefail
          base="http://127.0.0.1:8088"
          cookies="/tmp/swami-cookies.txt"

          csrf_json="$(curl -fsS -c "$cookies" -b "$cookies" "$base/api/admin/auth/csrf")"
          csrf="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["token"])' <<< "$csrf_json")"

          curl -fsS -c "$cookies" -b "$cookies" \
            -H "X-XSRF-TOKEN: $csrf" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            --data-urlencode "username=admin" \
            --data-urlencode "password=ci-test-password-12345" \
            "$base/api/admin/auth/login" > /tmp/login.json

          grep -q '"authenticated":true' /tmp/login.json

          csrf_json="$(curl -fsS -c "$cookies" -b "$cookies" "$base/api/admin/auth/csrf")"
          csrf="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["token"])' <<< "$csrf_json")"

          cat > /tmp/product.json <<'JSON'
          {
            "id": "SB-CI-01",
            "name": "CI Smoke Bag",
            "category": "Jute Bags",
            "material": "Natural jute",
            "price": 99,
            "priceUnit": "piece",
            "moq": 50,
            "stock": 120,
            "restockDays": null,
            "size": "15 x 14 x 5 in",
            "description": "Production runtime smoke-test product.",
            "features": ["Strong handles", "Custom printing"]
          }
          JSON

          curl -fsS -c "$cookies" -b "$cookies" \
            -H "X-XSRF-TOKEN: $csrf" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/product.json \
            "$base/api/admin/products" > /tmp/created.json

          grep -q '"id":"SB-CI-01"' /tmp/created.json

          code="$(curl -sS -c "$cookies" -b "$cookies" \
            -H "X-XSRF-TOKEN: $csrf" \
            -H "Content-Type: application/json" \
            --data '{"published":true}' \
            -o /tmp/publish-before-image.json -w '%{http_code}' \
            "$base/api/admin/products/SB-CI-01/publish")"
          test "$code" = "400"

          printf 'iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+A8AAQUBAScY42YAAAAASUVORK5CYII=' \
            | base64 --decode > /tmp/bag.png

          curl -fsS -c "$cookies" -b "$cookies" \
            -H "X-XSRF-TOKEN: $csrf" \
            -F "files=@/tmp/bag.png;type=image/png" \
            "$base/api/admin/products/SB-CI-01/images" > /tmp/upload.json

          grep -q '"kind":"ORIGINAL"' /tmp/upload.json

          code="$(curl -sS -c "$cookies" -b "$cookies" \
            -H "X-XSRF-TOKEN: $csrf" \
            -X POST \
            -o /tmp/ai-unconfigured.json -w '%{http_code}' \
            "$base/api/admin/products/SB-CI-01/marketing/generate")"
          test "$code" = "503"
          grep -q 'OPENAI_API_KEY is not configured' /tmp/ai-unconfigured.json

          curl -fsS -c "$cookies" -b "$cookies" \
            "$base/api/admin/products/generations?productId=SB-CI-01" > /tmp/generations.json
          grep -q '"status":"FAILED"' /tmp/generations.json

          curl -fsS -c "$cookies" -b "$cookies" \
            -H "X-XSRF-TOKEN: $csrf" \
            -H "Content-Type: application/json" \
            --data '{"published":true}' \
            "$base/api/admin/products/SB-CI-01/publish" > /tmp/published.json

          grep -q '"published":true' /tmp/published.json

          curl -fsS "$base/catalog/products.json" > /tmp/catalog.json
          grep -q '"CI Smoke Bag"' /tmp/catalog.json

          image_path="$(python3 -c 'import json; d=json.load(open("/tmp/catalog.json")); print(next(p["image"] for p in d["products"] if p["id"]=="SB-CI-01"))')"
          test -n "$image_path"
          curl -fsS "$base$image_path" -o /tmp/public-bag.png
          test -s /tmp/public-bag.png

      - name: Verify settings API and public config export
        run: |
          set -euo pipefail
          base="http://127.0.0.1:8088"
          cookies="/tmp/swami-cookies.txt"
          csrf_json="$(curl -fsS -c "$cookies" -b "$cookies" "$base/api/admin/auth/csrf")"
          csrf="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["token"])' <<< "$csrf_json")"

          curl -fsS -c "$cookies" -b "$cookies" \
            -H "X-XSRF-TOKEN: $csrf" \
            -H "Content-Type: application/json" \
            -X PUT \
            --data '{
              "brandName":"Swami Bags CI",
              "whatsappNumber":"919876543210",
              "businessPhone":"+91 98765 43210",
              "businessEmail":"sales@example.com",
              "businessAddress":"CI test address",
              "publicBaseUrl":"https://example.com"
            }' \
            "$base/api/admin/settings" > /tmp/settings.json

          grep -q '"brandName":"Swami Bags CI"' /tmp/settings.json
          curl -fsS "$base/catalog/config.json" > /tmp/public-config.json
          grep -q '"brandName":"Swami Bags CI"' /tmp/public-config.json
          grep -q '"whatsappNumber":"919876543210"' /tmp/public-config.json
          curl -fsS "$base/sitemap.xml" > /tmp/sitemap.xml
          grep -q 'https://example.com/products/ci-smoke-bag' /tmp/sitemap.xml

      - name: Verify backup and restore operations
        run: |
          set -euo pipefail
          base="http://127.0.0.1:8088"

          sh scripts/backup.sh
          archive="$(ls -1t backups/swami-data-*.tgz | head -n 1)"
          test -s "$archive"

          printf 'RESTORE\n' | sh scripts/restore.sh "$archive"

          for attempt in {1..30}; do
            if curl -fsS "$base/healthz" >/dev/null \
              && curl -fsS "$base/catalog/products.json" >/tmp/catalog-after-restore.json; then
              break
            fi
            sleep 2
          done

          grep -q '"CI Smoke Bag"' /tmp/catalog-after-restore.json
          curl -fsS "$base/catalog/config.json" > /tmp/config-after-restore.json
          grep -q '"brandName":"Swami Bags CI"' /tmp/config-after-restore.json

      - name: Show container state
        run: docker compose ps

      - name: Stop production stack
        if: always()
        run: docker compose down -v
