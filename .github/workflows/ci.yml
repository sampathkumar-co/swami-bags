name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck and build
        run: npm run build

  server:
    name: Spring Boot server
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Test and package
        run: mvn -B package

  runtime:
    name: Production runtime smoke
    runs-on: ubuntu-latest
    needs: [frontend, server]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare runtime environment
        run: cp .env.example .env

      - name: Validate Compose
        run: docker compose config --quiet

      - name: Build production images
        run: docker compose build

      - name: Start production stack
        run: docker compose up -d

      - name: Wait for public web and admin API
        run: |
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:8088/healthz >/dev/null               && curl -fsS http://127.0.0.1:8088/api/admin/auth/csrf >/dev/null               && curl -fsS http://127.0.0.1:8088/catalog/products.json >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs --tail=200
          exit 1

      - name: Verify protected admin endpoint
        run: |
          code="$(curl -sS -o /tmp/admin-response.json -w '%{http_code}' http://127.0.0.1:8088/api/admin/dashboard)"
          test "$code" = "401"

      - name: Show container state
        run: docker compose ps

      - name: Stop production stack
        if: always()
        run: docker compose down -v
