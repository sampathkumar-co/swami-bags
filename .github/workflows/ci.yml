name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Typecheck and build
        run: npm run build

  server:
    name: Spring Boot server
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Test and package
        run: mvn -B package

  runtime:
    name: Production runtime smoke
    runs-on: ubuntu-latest
    needs: [frontend, server]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Prepare runtime environment
        run: |
          cp .env.example .env
          chmod 600 .env
          sed -i 's/^ADMIN_PASSWORD=.*/ADMIN_PASSWORD=ci-test-password-12345/' .env
          sed -i 's/^SESSION_COOKIE_SECURE=.*/SESSION_COOKIE_SECURE=false/' .env
          sed -i 's|^PUBLIC_BASE_URL=.*|PUBLIC_BASE_URL=http://localhost:8088|' .env

      - name: Validate operations scripts and Compose
        run: |
          sh -n scripts/preflight.sh
          sh -n scripts/deploy.sh
          sh -n scripts/backup.sh
          sh -n scripts/restore.sh
          sh scripts/preflight.sh

      - name: Build production images
        run: docker compose build

      - name: Scan web image for high severity vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: swami-bags-web
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
          scanners: vuln,secret

      - name: Scan API image for high severity vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: swami-bags-api
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
          scanners: vuln,secret

      - name: Start production stack
        run: |
          if ! docker compose up -d; then
            docker compose ps -a
            docker compose logs --no-color --tail=250 api web
            exit 1
          fi

      - name: Wait for public web and admin API
        run: |
          for attempt in {1..40}; do
            if curl -fsS http://127.0.0.1:8088/healthz >/dev/null \
              && curl -fsS http://127.0.0.1:8088/api/admin/auth/csrf >/dev/null \
              && curl -fsS http://127.0.0.1:8088/catalog/products.json >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs --tail=200
          exit 1

      - name: Verify browser security headers
        run: |
          set -euo pipefail
          headers="$(curl -fsSI http://127.0.0.1:8088/)"
          grep -qi '^X-Content-Type-Options: nosniff' <<< "$headers"
          grep -qi '^X-Frame-Options: DENY' <<< "$headers"
          grep -qi '^Content-Security-Policy:' <<< "$headers"
          ! grep -qi "style-src[^;]*'unsafe-inline'" <<< "$headers"
          grep -qi '^Referrer-Policy: strict-origin-when-cross-origin' <<< "$headers"
          grep -qi '^Strict-Transport-Security:' <<< "$headers"

          catalog_headers="$(curl -fsSI http://127.0.0.1:8088/catalog/products.json)"
          grep -qi '^X-Content-Type-Options: nosniff' <<< "$catalog_headers"
          grep -qi '^Content-Security-Policy:' <<< "$catalog_headers"

      - name: Verify protected admin endpoint
        run: |
          code="$(curl -sS -o /tmp/admin-response.json -w '%{http_code}' http://127.0.0.1:8088/api/admin/dashboard)"
          test "$code" = "401"

      - name: Verify unknown API routes stay denied
        run: |
          code="$(curl -sS -o /tmp/unknown-api.json -w '%{http_code}' http://127.0.0.1:8088/api/not-a-real-route)"
          test "$code" = "401" || test "$code" = "403"

      - name: Exercise authenticated product publish flow
        run: |
          set -euo pipefail
          base="http://127.0.0.1:8088"
          cookies="/tmp/swami-cookies.txt"

          csrf_json="$(curl -fsS -D /tmp/csrf-headers.txt -c "$cookies" -b "$cookies" "$base/api/admin/auth/csrf")"
          csrf="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["token"])' <<< "$csrf_json")"
          grep -qi 'Set-Cookie: XSRF-TOKEN=.*HttpOnly.*SameSite=Strict' /tmp/csrf-headers.txt

          curl -fsS -D /tmp/login-headers.txt -c "$cookies" -b "$cookies" \
            -H "X-XSRF-TOKEN: $csrf" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            --data-urlencode "username=admin" \
            --data-urlencode "password=ci-test-password-12345" \
            "$base/api/admin/auth/login" > /tmp/login.json

          grep -q '"authenticated":true' /tmp/login.json
          grep -qi 'Set-Cookie: SWAMI_ADMIN_SESSION=.*HttpOnly.*SameSite=Strict' /tmp/login-headers.txt

          csrf_json="$(curl -fsS -c "$cookies" -b "$cookies" "$base/api/admin/auth/csrf")"
          csrf="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["token"])' <<< "$csrf_json")"

          python3 - <<'PY'
          from pathlib import Path
          Path('/tmp/oversized.json').write_text('"' + ('x' * 1100000) + '"')
          PY
          oversized_code="$(curl -sS -c "$cookies" -b "$cookies" \
            -H "X-XSRF-TOKEN: $csrf" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/oversized.json \
            -o /tmp/oversized-response.txt -w '%{http_code}' \
            "$base/api/admin/products")"
          test "$oversized_code" = "413"

          cat > /tmp/product.json <<'JSON'
          {
            "id": "SB-CI-01",
            "name": "CI Smoke Bag",
            "category": "Jute Bags",
            "material": "Natural jute",
            "price": 99,
            "priceUnit": "piece",
            "moq": 50,
            "stock": 120,
            "restockDays": null,
            "size": "15 x 14 x 5 in",
            "description": "Production runtime smoke-test product.",
            "features": ["Strong handles", "Custom printing"]
          }
          JSON

          curl -fsS -c "$cookies" -b "$cookies" \
            -H "X-XSRF-TOKEN: $csrf" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/product.json \
            "$base/api/admin/products" > /tmp/created.json

          grep -q '"id":"SB-CI-01"' /tmp/created.json

          code="$(curl -sS -c "$cookies" -b "$cookies" \
            -H "X-XSRF-TOKEN: $csrf" \
            -H "Content-Type: application/json" \
            --data '{"published":true}' \
            -o /tmp/publish-before-image.json -w '%{http_code}' \
            "$base/api/admin/products/SB-CI-01/publish")"
          test "$code" = "400"

          printf 'not-a-real-png' > /tmp/fake.png
          fake_code="$(curl -sS -c "$cookies" -b "$cookies" \
            -H "X-XSRF-TOKEN: $csrf" \
            -F "files=@/tmp/fake.png;type=image/png" \
            -o /tmp/fake-upload.json -w '%{http_code}' \
            "$base/api/admin/products/SB-CI-01/images")"
          test "$fake_code" = "400"

          printf 'iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+A8AAQUBAScY42YAAAAASUVORK5CYII=' \
            | base64 --decode > /tmp/bag.png

          curl -fsS -c "$cookies" -b "$cookies" \
            -H "X-XSRF-TOKEN: $csrf" \
            -F "files=@/tmp/bag.png;type=image/png" \
            "$base/api/admin/products/SB-CI-01/images" > /tmp/upload.json

          grep -q '"kind":"ORIGINAL"' /tmp/upload.json

          code="$(curl -sS -c "$cookies" -b "$cookies" \
            -H "X-XSRF-TOKEN: $csrf" \
            -X POST \
            -o /tmp/ai-unconfigured.json -w '%{http_code}' \
            "$base/api/admin/products/SB-CI-01/marketing/generate")"
          test "$code" = "503"
          grep -q 'OPENAI_API_KEY is not configured' /tmp/ai-unconfigured.json

          curl -fsS -c "$cookies" -b "$cookies" \
            "$base/api/admin/products/generations?productId=SB-CI-01" > /tmp/generations.json
          grep -q '"status":"FAILED"' /tmp/generations.json

          curl -fsS -c "$cookies" -b "$cookies" \
            -H "X-XSRF-TOKEN: $csrf" \
            -H "Content-Type: application/json" \
            --data '{"published":true}' \
            "$base/api/admin/products/SB-CI-01/publish" > /tmp/published.json

          grep -q '"published":true' /tmp/published.json

          curl -fsS "$base/catalog/products.json" > /tmp/catalog.json
          grep -q '"CI Smoke Bag"' /tmp/catalog.json

          image_path="$(python3 -c 'import json; d=json.load(open("/tmp/catalog.json")); print(next(p["image"] for p in d["products"] if p["id"]=="SB-CI-01"))')"
          test -n "$image_path"
          curl -fsS "$base$image_path" -o /tmp/public-bag.png
          test -s /tmp/public-bag.png

      - name: Verify settings API and public config export
        run: |
          set -euo pipefail
          base="http://127.0.0.1:8088"
          cookies="/tmp/swami-cookies.txt"
          csrf_json="$(curl -fsS -c "$cookies" -b "$cookies" "$base/api/admin/auth/csrf")"
          csrf="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["token"])' <<< "$csrf_json")"

          curl -fsS -c "$cookies" -b "$cookies" \
            -H "X-XSRF-TOKEN: $csrf" \
            -H "Content-Type: application/json" \
            -X PUT \
            --data '{
              "brandName":"New Chandra Bags CI",
              "whatsappNumber":"919876543210",
              "businessPhone":"+91 98765 43210",
              "businessEmail":"sales@example.com",
              "businessAddress":"CI test address",
              "publicBaseUrl":"https://example.com"
            }' \
            "$base/api/admin/settings" > /tmp/settings.json

          grep -q '"brandName":"New Chandra Bags CI"' /tmp/settings.json
          curl -fsS "$base/catalog/config.json" > /tmp/public-config.json
          grep -q '"brandName":"New Chandra Bags CI"' /tmp/public-config.json
          grep -q '"whatsappNumber":"919876543210"' /tmp/public-config.json
          curl -fsS "$base/sitemap.xml" > /tmp/sitemap.xml
          grep -q 'https://example.com/products/ci-smoke-bag' /tmp/sitemap.xml

      - name: Verify logo replacement lifecycle
        run: |
          set -euo pipefail
          base="http://127.0.0.1:8088"
          cookies="/tmp/swami-cookies.txt"

          csrf_json="$(curl -fsS -c "$cookies" -b "$cookies" "$base/api/admin/auth/csrf")"
          csrf="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["token"])' <<< "$csrf_json")"

          curl -fsS -c "$cookies" -b "$cookies"             -H "X-XSRF-TOKEN: $csrf"             -F "file=@/tmp/bag.png;type=image/png"             "$base/api/admin/settings/logo" > /tmp/logo-one.json
          logo_one="$(python3 -c 'import json; print(json.load(open("/tmp/logo-one.json"))["logoUrl"])')"
          [[ "$logo_one" == /media/brand/logo-*.png ]]
          curl -fsS "$base$logo_one" -o /tmp/logo-one.png
          test -s /tmp/logo-one.png

          csrf_json="$(curl -fsS -c "$cookies" -b "$cookies" "$base/api/admin/auth/csrf")"
          csrf="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["token"])' <<< "$csrf_json")"
          curl -fsS -c "$cookies" -b "$cookies"             -H "X-XSRF-TOKEN: $csrf"             -F "file=@/tmp/bag.png;type=image/png"             "$base/api/admin/settings/logo" > /tmp/logo-two.json
          logo_two="$(python3 -c 'import json; print(json.load(open("/tmp/logo-two.json"))["logoUrl"])')"
          [[ "$logo_two" == /media/brand/logo-*.png ]]
          test "$logo_two" != "$logo_one"
          test "$(curl -sS -o /dev/null -w '%{http_code}' "$base$logo_one")" = "404"

          csrf_json="$(curl -fsS -c "$cookies" -b "$cookies" "$base/api/admin/auth/csrf")"
          csrf="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["token"])' <<< "$csrf_json")"
          curl -fsS -c "$cookies" -b "$cookies"             -H "X-XSRF-TOKEN: $csrf"             -X DELETE             "$base/api/admin/settings/logo" > /tmp/logo-delete.json
          grep -q '"logoUrl":""' /tmp/logo-delete.json
          test "$(curl -sS -o /dev/null -w '%{http_code}' "$base$logo_two")" = "404"

      - name: Verify backup and restore operations
        run: |
          set -euo pipefail
          base="http://127.0.0.1:8088"

          sh scripts/backup.sh
          archive="$(ls -1t backups/swami-data-*.tgz | head -n 1)"
          test -s "$archive"

          printf 'RESTORE\n' | sh scripts/restore.sh "$archive"

          for attempt in {1..30}; do
            if curl -fsS "$base/healthz" >/dev/null \
              && curl -fsS "$base/catalog/products.json" >/tmp/catalog-after-restore.json; then
              break
            fi
            sleep 2
          done

          grep -q '"CI Smoke Bag"' /tmp/catalog-after-restore.json
          curl -fsS "$base/catalog/config.json" > /tmp/config-after-restore.json
          grep -q '"brandName":"New Chandra Bags CI"' /tmp/config-after-restore.json

      - name: Verify public catalogue stays available without the API
        run: |
          set -euo pipefail
          base="http://127.0.0.1:8088"
          image_path="$(python3 -c 'import json; d=json.load(open("/tmp/catalog-after-restore.json")); print(next(p["image"] for p in d["products"] if p["id"]=="SB-CI-01"))')"

          docker compose stop api
          curl -fsS "$base/" >/tmp/home-with-api-stopped.html
          curl -fsS "$base/catalog/products.json" >/tmp/catalog-with-api-stopped.json
          curl -fsS "$base$image_path" >/tmp/image-with-api-stopped.png
          grep -q '"CI Smoke Bag"' /tmp/catalog-with-api-stopped.json
          test -s /tmp/image-with-api-stopped.png

          docker compose start api
          for attempt in {1..30}; do
            if curl -fsS "$base/api/admin/auth/csrf" >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs --tail=100 api
          exit 1

      - name: Show container state
        run: docker compose ps

      - name: Stop production stack
        if: always()
        run: docker compose down -v