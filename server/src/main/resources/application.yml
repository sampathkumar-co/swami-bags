server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
  servlet:
    session:
      timeout: 30m
      tracking-modes: cookie
      cookie:
        name: SWAMI_ADMIN_SESSION
        http-only: true
        same-site: strict
        secure: ${SESSION_COOKIE_SECURE:false}

spring:
  application:
    name: swami-bags-server
  datasource:
    url: jdbc:sqlite:${DATA_DIR:/data}/swami-bags.db
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 1
      minimum-idle: 1
      connection-init-sql: PRAGMA foreign_keys=ON;
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      continue-on-error: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 40MB

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

app:
  admin-username: ${ADMIN_USERNAME:}
  admin-password: ${ADMIN_PASSWORD:}
  data-dir: ${DATA_DIR:/data}
  brand-name: ${BRAND_NAME:New Chandra Bags}
  whatsapp-number: ${WHATSAPP_NUMBER:}
  business-phone: ${BUSINESS_PHONE:}
  business-email: ${BUSINESS_EMAIL:}
  business-address: ${BUSINESS_ADDRESS:}
  public-base-url: ${PUBLIC_BASE_URL:http://localhost:8088}
  open-ai-api-key: ${OPENAI_API_KEY:}
  open-ai-image-model: ${OPENAI_IMAGE_MODEL:gpt-image-2.5-sunburst}
  open-ai-image-quality: ${OPENAI_IMAGE_QUALITY:medium}
  open-ai-image-size: ${OPENAI_IMAGE_SIZE:1536x1024}

logging:
  level:
    root: INFO
    org.springframework.security: WARN
