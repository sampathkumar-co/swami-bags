x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  api:
    build:
      context: ./server
    restart: unless-stopped
    environment:
      PORT: "8080"
      DATA_DIR: /data
      ADMIN_USERNAME: ${ADMIN_USERNAME:?Set ADMIN_USERNAME in .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
      BRAND_NAME: ${BRAND_NAME:-Swami Bags}
      WHATSAPP_NUMBER: ${WHATSAPP_NUMBER:-}
      BUSINESS_PHONE: ${BUSINESS_PHONE:-}
      BUSINESS_EMAIL: ${BUSINESS_EMAIL:-}
      BUSINESS_ADDRESS: ${BUSINESS_ADDRESS:-}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8088}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_IMAGE_MODEL: ${OPENAI_IMAGE_MODEL:-gpt-image-2.5-sunburst}
      OPENAI_IMAGE_QUALITY: ${OPENAI_IMAGE_QUALITY:-medium}
      OPENAI_IMAGE_SIZE: ${OPENAI_IMAGE_SIZE:-1536x1024}
      JAVA_TOOL_OPTIONS: "-Xms64m -Xmx256m -Djava.awt.headless=true"
    volumes:
      - swami-data:/data
    expose:
      - "8080"
    mem_limit: 384m
    pids_limit: 160
    read_only: true
    tmpfs:
      - /tmp:rw,exec,nosuid,nodev,size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  web:
    build:
      context: .
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-8088}:80"
    volumes:
      - swami-data:/data:ro
    mem_limit: 96m
    pids_limit: 96
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  backup-ops:
    image: alpine:3.24.2@sha256:31b6477333eb8257db9e5d7c3a7264fd0467928756f0bbcc27d35bea5d28cdbd
    profiles: ["ops"]
    user: "${OPS_UID:-0}:${OPS_GID:-0}"
    volumes:
      - swami-data:/data:ro
      - ./backups:/backup
    pids_limit: 64
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  restore-ops:
    image: alpine:3.24.2@sha256:31b6477333eb8257db9e5d7c3a7264fd0467928756f0bbcc27d35bea5d28cdbd
    profiles: ["ops"]
    volumes:
      - swami-data:/data
      - ./backups:/backup:ro
    pids_limit: 64
    cap_drop:
      - ALL
    cap_add:
      - DAC_OVERRIDE
    security_opt:
      - no-new-privileges:true

volumes:
  swami-data:
